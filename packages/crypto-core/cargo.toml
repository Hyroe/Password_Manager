[package]
name = "pm-crypto-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = "0.6.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
hkdf = "0.13.0"
sha2 = "0.11.0"
wasm-bindgen = "0.2.128"
zeroize = "1.9.0"